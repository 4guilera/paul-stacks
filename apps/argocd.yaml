apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.6
      helm:
        releaseName: argocd # must match bootstrap.sh so Argo adopts, not duplicates
        valueFiles:
          - $values/values/argocd.yaml
    - repoURL: https://github.com/4guilera/paul-stacks.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false # a bad commit must never be able to delete Argo CD itself
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # Argo's own CRDs are too large for client-side apply
