apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-driver-nfs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    chart: csi-driver-nfs
    targetRevision: 4.13.4
    helm:
      valuesObject:
        storageClass:
          create: true
          name: nfs-csi
          reclaimPolicy: Retain
          volumeBindingMode: Immediate
          parameters:
            server: 10.0.20.5
            share: __NFS_SHARE__
            subDir: ${pvc.metadata.namespace}/${pvc.metadata.name} # stable path = data survives rebuilds
            onDelete: retain
          mountOptions:
            - nfsvers=4.1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
