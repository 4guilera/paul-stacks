apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/4guilera/paul-stacks.git
    targetRevision: main
    path: manifests/secrets
  destination:
    server: https://kubernetes.default.svc
    # No namespace here: each Secret declares its own
  syncPolicy:
    automated:
      prune: false # a bad commit must never be able to delete credentials
      selfHeal: true
