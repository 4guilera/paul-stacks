apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrape-targets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/4guilera/paul-stacks.git
    targetRevision: main
    path: manifests/monitoring/scrape-targets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
