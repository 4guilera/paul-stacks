# KSOPS: decrypts the listed SOPS files when Argo CD renders this app.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./monitoring/grafana-admin.sops.yaml
  - ./monitoring/pve-exporter.sops.yaml
