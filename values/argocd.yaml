# Argo CD Helm values. Used by bootstrap.sh AND by apps/argocd.yaml,
# so the bootstrap install and the self-managed install are identical.

dex:
  enabled: false # local admin for now; SSO is a possible later project

configs:
  cm:
    # Required for KSOPS: lets Kustomize run the ksops exec plugin
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

controller:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  # --- KSOPS: decrypt SOPS-encrypted Secrets at render time -----------------
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/keys.txt
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age # loaded by bootstrap.sh, never stored in Git
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /.config/sops/age
      name: sops-age
      readOnly: true

server:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

redis:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

applicationSet:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

notifications:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
