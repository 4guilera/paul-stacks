# SOPS rules for paul-stacks. The public key is safe to commit;
# the private key never leaves the provisioner and the password manager.
creation_rules:
  - path_regex: manifests/secrets/.*\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$ # encrypt values only; names and metadata stay readable in diffs
    age: age1cu69mlylyts3gyjr53skqdh0whwanp6mh0nt7gtervjsl94p94mql5642t
