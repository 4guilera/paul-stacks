all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/paul-stacks
  children:
    k3s_server:
      hosts:
        k3s1:
          ansible_host: 10.0.20.70
    k3s_agent:
      hosts:
        k3s2:
          ansible_host: 10.0.20.71
    k3s_cluster:
      children:
        k3s_server:
        k3s_agent:

    # Range VMs built by range-as-code. They trust its existing key,
    # so these override the paul-stacks defaults above.
    exporters_linux:
      vars:
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      hosts:
        target01:
          ansible_host: 10.0.20.62
          ansible_user: ubuntu
        splunk:
          ansible_host: 10.0.20.20
          ansible_user: splunk
