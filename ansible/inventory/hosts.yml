all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/paul-stacks
  children:
    k3s_server:
      hosts:
        k3s1:
          ansible_host: 10.0.20.70
    k3s_agent:
      hosts:
        k3s2:
          ansible_host: 10.0.20.71
    k3s_cluster:
      children:
        k3s_server:
        k3s_agent:

    # Range VMs built by range-as-code. They trust its existing key,
    # so these override the paul-stacks defaults above.
    exporters_linux:
      vars:
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      hosts:
        target01:
          ansible_host: 10.0.20.62
          ansible_user: ubuntu
        splunk:
          ansible_host: 10.0.20.20
          ansible_user: splunk

    # Windows range hosts. NTLM encrypts WinRM traffic even over HTTP
    # (range-as-code's 'basic' transport sends credentials readably).
    # Passwords: ansible/host_vars/<host>.sops.yaml (SOPS-encrypted).
    exporters_windows:
      vars:
        ansible_connection: winrm
        ansible_winrm_transport: ntlm
        ansible_winrm_scheme: http
        ansible_winrm_port: 5985
      hosts:
        dc01:
          ansible_host: 10.0.20.60
          ansible_user: Administrator
        ws01:
          ansible_host: 10.0.20.61
          ansible_user: Admin
